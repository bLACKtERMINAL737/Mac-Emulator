<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Mac Emulator - run Android apps on your Mac">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#143a4a"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="mac" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="340" rx="24" fill="url(#bg)"/>
  <circle cx="1010" cy="170" r="210" fill="url(#glow)"/>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 85H1280M0 170H1280M0 255H1280"/>
    <path d="M320 0V340M640 0V340M960 0V340"/>
  </g>

  <!-- title -->
  <text x="80" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="80" font-weight="800" fill="#ffffff" letter-spacing="-2">Mac Emulator</text>
  <text x="84" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#a7f3d0">Android emulator for Mac. Run Android apps on your Mac.</text>
  <text x="84" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#cbd5e1">One script. Official Android Emulator. Auto-tuned to your hardware.</text>

  <!-- laptop -->
  <g transform="translate(760 70)">
    <rect x="0" y="0" width="340" height="205" rx="14" fill="#1e293b" stroke="url(#mac)" stroke-width="6"/>
    <rect x="16" y="16" width="308" height="173" rx="6" fill="#0b1220"/>
    <path d="M-30 222H370L346 244H-6Z" fill="url(#mac)"/>
    <rect x="130" y="222" width="80" height="8" rx="4" fill="#64748b"/>
    <!-- code lines on laptop screen -->
    <g fill="#34d399" fill-opacity="0.85" font-family="Menlo, Consolas, monospace" font-size="14">
      <text x="32" y="48">$ ./mac-emulator.sh setup</text>
      <text x="32" y="74" fill="#94a3b8">✓ Detected Apple Silicon</text>
      <text x="32" y="98" fill="#94a3b8">✓ Profile: balanced</text>
      <text x="32" y="122" fill="#94a3b8">✓ Virtual phone ready</text>
      <text x="32" y="156">$ ./mac-emulator.sh run app.apk</text>
    </g>
  </g>

  <!-- phone -->
  <g transform="translate(1085 40)">
    <rect x="0" y="0" width="140" height="260" rx="26" fill="#0b1220" stroke="url(#phone)" stroke-width="6"/>
    <rect x="14" y="26" width="112" height="208" rx="10" fill="#111827"/>
    <rect x="52" y="10" width="36" height="6" rx="3" fill="#334155"/>
    <!-- app icons -->
    <g>
      <rect x="26" y="42" width="30" height="30" rx="8" fill="#34d399"/>
      <rect x="70" y="42" width="30" height="30" rx="8" fill="#38bdf8"/>
      <rect x="26" y="88" width="30" height="30" rx="8" fill="#fbbf24"/>
      <rect x="70" y="88" width="30" height="30" rx="8" fill="#f472b6"/>
      <rect x="26" y="134" width="30" height="30" rx="8" fill="#a78bfa"/>
      <rect x="70" y="134" width="30" height="30" rx="8" fill="#fb7185"/>
    </g>
    <rect x="26" y="196" width="74" height="22" rx="11" fill="#ffffff" fill-opacity="0.12"/>
  </g>
</svg>
