<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-label="Terminal showing Mac Emulator setup and run">
  <rect width="900" height="470" rx="14" fill="#0b1220"/>
  <rect width="900" height="40" rx="14" fill="#1e293b"/>
  <rect y="26" width="900" height="14" fill="#1e293b"/>
  <circle cx="26" cy="20" r="7" fill="#ef4444"/>
  <circle cx="50" cy="20" r="7" fill="#f59e0b"/>
  <circle cx="74" cy="20" r="7" fill="#22c55e"/>
  <text x="450" y="25" text-anchor="middle" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8">Terminal — mac-emulator</text>

  <g font-family="Menlo, Monaco, Consolas, monospace" font-size="15">
    <text x="28" y="76"  fill="#e2e8f0"><tspan fill="#34d399">$</tspan> git clone https://github.com/bLACKtERMINAL737/Mac-Emulator.git &amp;&amp; cd mac-emulator</text>
    <text x="28" y="106" fill="#e2e8f0"><tspan fill="#34d399">$</tspan> ./mac-emulator.sh setup</text>

    <text x="28" y="140" fill="#22d3ee">==&gt; Step 1/5  Java</text>
    <text x="28" y="164" fill="#22d3ee">==&gt; Step 2/5  Android command-line tools</text>
    <text x="28" y="188" fill="#22d3ee">==&gt; Step 3/5  Downloading Android 34 (arm64-v8a)</text>
    <text x="28" y="212" fill="#22d3ee">==&gt; Step 4/5  Creating the virtual phone 'MacEmulator'</text>
    <text x="28" y="236" fill="#22d3ee">==&gt; Step 5/5  Tuning for this Mac</text>
    <text x="28" y="262" fill="#94a3b8">    Profile 'balanced': 4 CPU cores, 4096 MB RAM, 720x1600 screen</text>
    <text x="28" y="288" fill="#a7f3d0">==&gt; All done!</text>

    <text x="28" y="326" fill="#e2e8f0"><tspan fill="#34d399">$</tspan> ./mac-emulator.sh run ~/Downloads/my-app.apk</text>
    <text x="28" y="356" fill="#22d3ee">==&gt; Starting emulator (first boot can take 1-3 minutes)</text>
    <text x="28" y="380" fill="#94a3b8">  <tspan fill="#34d399">✓</tspan> Emulator is ready</text>
    <text x="28" y="404" fill="#22d3ee">==&gt; Installing: /Users/you/Downloads/my-app.apk</text>
    <text x="28" y="428" fill="#94a3b8">Success</text>
    <text x="28" y="452" fill="#22d3ee">==&gt; Opening com.example.myapp</text>
  </g>
</svg>
